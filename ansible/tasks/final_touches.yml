- name: Make code directory
  file:
    path: "{{ lookup('env', 'HOME') }}/code"
    state: directory
  tags:
    - nvim
    - fish
    - shaders
- name: Clone aws-iam-actions-list
  ansible.builtin.git:
    repo: 'git@github.com:TryTryAgain/aws-iam-actions-list.git'
    dest: "{{ lookup('env', 'HOME') }}/code/aws-iam-actions-list"
    force: yes
    update: yes
  tags:
    - nvim
- name: Make config fish themes directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/fish/themes"
    state: directory
  tags:
    - fish
- name: Copy the theme to correct directory
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/code/fish/themes/Dracula Official.theme"
    dest: "{{ lookup('env', 'HOME') }}/.config/fish/themes/Dracula Official.theme"
  tags:
    - fish
- name: Clone ghostty-shader-playground repo at specific commit
  git:
    repo: "https://github.com/KroneCorylus/ghostty-shader-playground"
    dest: "{{ ansible_facts.env.HOME }}/code/ghostty-shader-playground"
    version: "b539cea7b34cdc883726db018ae09e8e3f862aea"
    depth: 1
    update: yes
  tags:
    - shaders
- name: Ensure Ghostty config directory exists
  file:
    path: "{{ ansible_facts.env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'
  tags:
    - ghostty
- name: Deploy Ghostty config
  template:
    src: ghostty-config.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/ghostty/config"
    mode: '0644'
  tags:
    - ghostty
- name: Install Pi coding agent via npm
  when: is_personal_machine | bool
  tags:
    - pi
  block:
    - name: Ensure local npm prefix directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local"
        state: directory
        mode: '0755'

    - name: Check if Pi is installed via local npm prefix
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/pi --version"
      register: pi_local_check
      changed_when: false
      failed_when: false

    - name: Install Pi coding agent
      ansible.builtin.command: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      environment:
        npm_config_prefix: "{{ ansible_facts.env.HOME }}/.local"
      when: pi_local_check.rc != 0
- name: Configure Pi extension integration for Herdr
  when: is_personal_machine | bool
  tags:
    - pi
    - herdr
  block:
    - name: Ensure Pi agent extensions directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.pi/agent/extensions"
        state: directory
        mode: '0755'

    - name: Install Herdr Pi integration
      ansible.builtin.command: herdr integration install pi
      args:
        creates: "{{ ansible_facts.env.HOME }}/.pi/agent/extensions/herdr-agent-state.ts"

- name: Check if ryu is installed
  ansible.builtin.command: command -v ryu
  register: ryu_check
  changed_when: false
  failed_when: false
  tags:
    - jj-ryu
- name: Install jj-ryu via cargo (git)
  ansible.builtin.command: cargo install --git https://github.com/dmmulroy/jj-ryu
  when: ryu_check.rc != 0
  tags:
    - jj-ryu
- name: Check installed rustup components for stable toolchain
  ansible.builtin.command: rustup component list --installed --toolchain stable
  register: rustup_stable_components
  changed_when: false
  failed_when: false
  when: is_personal_machine | bool
  tags:
    - rust
    - clippy
- name: Ensure clippy is installed for stable rustup toolchain
  ansible.builtin.command: rustup component add clippy --toolchain stable
  when:
    - is_personal_machine | bool
    - rustup_stable_components is defined
    - rustup_stable_components.rc == 0
    - "'clippy' not in rustup_stable_components.stdout"
  tags:
    - rust
    - clippy

